name: 秘密・個人情報の検査

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Git 履歴と追跡ファイルの検査
    runs-on: ubuntu-24.04
    steps:
      - name: Git の全履歴を取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks で全履歴を検査
        run: |
          set -euo pipefail
          git rev-parse --verify HEAD >/dev/null || exit 1
          commit_count=$(git rev-list --count --all)
          [[ "$commit_count" -gt 0 ]] || exit 1
          git log -p -U0 --all >/dev/null
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          work_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXXXX")"
          (
            cd "$work_dir"
            curl --fail --silent --show-error --location --remote-name \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check -
            tar -xzf "$archive" gitleaks
          )
          for config in .gitleaks-default.toml .gitleaks.toml; do
            scan_status=0
            scan_output=$("$work_dir/gitleaks" git --config "$config" --log-opts="--all" --redact=100 . 2>&1) || scan_status=$?
            printf '%s\n' "$scan_output"
            [[ "$scan_status" == 0 ]] || exit "$scan_status"
            case "$scan_output" in
              *' 0 commits scanned.'*|*'failed to scan Git repository'*) exit 1 ;;
            esac
          done
      - name: 追跡ファイルと履歴上のパスを検査
        if: ${{ success() || failure() }}
        run: bash scripts/check_pii.sh --history-paths
