name: ビルドとテスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: ホストテスト
        env:
          UBSAN_OPTIONS: halt_on_error=1
          SANITIZERS: ${{ matrix.sanitizers }}
        run: |
          cmake -S firmware/host_test -B build/host -DGROKWATCH_SANITIZERS="$SANITIZERS"
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: uv の導入
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/python" -m pip install uv==0.13.9
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: Python テスト
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv run --locked --all-packages --python "$PYTHON_VERSION" pytest gateway/tests bridge/tests tests/e2e tests/repo

  firmware-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: ESP32-S3 ビルドとパーティション検査
        run: |
          source "$IDF_PATH/export.sh"
          git ls-files --error-unmatch firmware/dependencies.lock
          git ls-files --error-unmatch uv.lock
          test ! -e firmware/sdkconfig.local.defaults
          (
            cd firmware
            idf.py set-target esp32s3
            idf.py build
          )
          git diff --exit-code HEAD -- firmware/dependencies.lock
          python scripts/check_firmware_build.py
